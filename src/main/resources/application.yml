server:
  port: 8080

spring:
  application:
    name: be-api

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:local-secret-key}
    issuer: my-backend-api
    audience: web
    access-token-validity-ms: 900000
    refresh-token-validity-ms: 1209600000
    clock-skew-sec: 60
